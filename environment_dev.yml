name: laypa
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.12
  - numpy
  - pytorch-gpu
  - torchvision
  - cuda-toolkit=13.0
  - opencv
  - matplotlib
  - scipy
  - pip
  - setuptools
  - wheel
  - ninja
  - tensorboard
  - flask
  - prometheus_client
  - imagesize
  - gunicorn
  - pillow
  - shapely
  - natsort
  - tqdm
  - scikit-image
  # - jpeg # For loading JPEG2000 images
  # - pygments #Optional for colors
  - pip:
      - --no-build-isolation
      - ultralytics
      - pi-heif
      - torch-tb-profiler
      - "git+https://github.com/facebookresearch/detectron2.git"
      - "git+https://github.com/cocodataset/panopticapi.git"
